<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Blockcraft</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: #87CEEB; }
  canvas { display: block; }
  #crosshair {
    position: fixed; top: 50%; left: 50%; width: 8px; height: 8px;
    margin: -4px 0 0 -4px; border: 2px solid rgba(255,255,255,0.9);
    border-radius: 50%; pointer-events: none; mix-blend-mode: difference;
  }
  #hud {
    position: fixed; left: 12px; bottom: 12px; color: #fff; font: 14px/1.4 monospace;
    text-shadow: 0 1px 2px rgba(0,0,0,0.8); pointer-events: none; user-select: none;
  }
  #hotbar {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 6px; pointer-events: none;
  }
  .slot {
    width: 44px; height: 44px; border: 2px solid rgba(255,255,255,0.6);
    border-radius: 4px; display: flex; align-items: center; justify-content: center;
    font: bold 12px sans-serif; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.8);
  }
  .slot.active { border-color: #fff; box-shadow: 0 0 8px rgba(255,255,255,0.9); }
  #overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); color: #fff;
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    font: 16px/1.6 sans-serif; text-align: center; cursor: pointer;
  }
  #overlay h1 { margin: 0 0 8px; font-size: 32px; }
  #overlay .hint { font-size: 14px; opacity: 0.85; max-width: 480px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div id="crosshair"></div>
  <div id="hud">FPS: <span id="fps">0</span></div>
  <div id="hotbar">
    <div class="slot active" data-slot="1">Grass</div>
    <div class="slot" data-slot="2">Dirt</div>
    <div class="slot" data-slot="3">Stone</div>
    <div class="slot" data-slot="4">Wood</div>
  </div>
  <div id="overlay">
    <h1>Blockcraft</h1>
    <p>Click to play</p>
    <p class="hint">
      WASD to move &middot; Mouse to look &middot; Space to jump &middot;
      Left click to break a block &middot; Right click to place a block &middot;
      1-4 to choose block type &middot; Esc to release mouse
    </p>
  </div>
  <script type="importmap">
    {
      "imports": {
        "three": "/node_modules/three/build/three.module.js",
        "three/addons/": "/node_modules/three/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
